# A mail server for development and tests. Not a production configuration.
#
# It listens without encryption because it is reachable only from the loopback interface of the
# machine running it, and the client refuses plaintext to anything else. Accounts are declared
# below with one shared password; no real credentials belong here.
#
# IMAP is the only port published to the machine. LMTP and the authentication service are for the
# submission container beside this one, over the network compose makes for the two of them, and
# nothing outside that network can reach either.

protocols = imap lmtp
listen = *

log_path = /dev/stderr
info_log_path = /dev/stderr

ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

mail_home = /srv/mail/%u
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000

# Modification sequences, and the ability to resume with QRESYNC, are what the synchronisation
# strategies are tested against. Dovecot keeps them in the mailbox index.
mailbox_list_index = yes

passdb {
  driver = static
  args = password=lyonoyl allow_nets=0.0.0.0/0
}

userdb {
  driver = static
  # allow_all_users lets tools that do not authenticate — the seeding script uses doveadm — look up
  # any address. Acceptable here because the server is unreachable from outside this machine.
  args = uid=1000 gid=1000 home=/srv/mail/%u allow_all_users=yes
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

# Where the submission container delivers what it accepts. The recipient's address is the user name
# LMTP looks up, and it is the same string the IMAP login uses, so a message sent to an address
# lands in the inbox that signs in as that address.
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# The submission container asks here whether a user name and password are right, so both protocols
# sign in against the one password above.
service auth {
  inet_listener sasl {
    port = 12345
  }
}

namespace inbox {
  inbox = yes

  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
